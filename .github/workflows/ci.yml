name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  flutter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - run: flutter_rust_bridge_codegen generate
      - run: git diff --exit-code -- apps/mobile/lib/src/rust crates/trackpad-bridge/src/frb_generated.rs
        shell: bash
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile

  tauri-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

  tauri-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: apps/desktop/package.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npx tauri build
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  desktop-web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: apps/desktop/package.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: node tools/web-gesture-test.js
