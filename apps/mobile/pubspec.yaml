name: trackpad_mobile
description: Wireless Phone Trackpad - phone app (Phase 0 hello).
publish_to: "none"
version: 0.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: "3.35.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  # Pinned 2026-10 after checking pub.dev latest versions.
  mobile_scanner: 7.4.2 # QR scan (pairing ceremony)
  multicast_dns: 0.3.3 # LAN discovery browse (_wptrackpad._tcp)
  flutter_secure_storage: 10.3.4 # client keypair + trusted computer (11.x needs Dart 3.10)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
