<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phone Trackpad</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #141518; color: #eceef1;
    font-family: -apple-system, system-ui, sans-serif; font-size: 15px;
    display: flex; flex-direction: column; overflow: hidden;
    touch-action: none; overscroll-behavior: none; user-select: none;
    -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #bar {
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    font-size: 13px; color: #a3a7ae; text-align: center; flex: none;
  }
  #bar.live { color: #4ade80; }
  #pad {
    flex: 1; margin: 0 12px calc(12px + env(safe-area-inset-bottom));
    border: 1px solid #2e3138; border-radius: 16px; background: #1e2024;
    display: flex; align-items: center; justify-content: center;
    text-align: center; color: #a3a7ae; padding: 20px;
  }
  #gate {
    position: fixed; inset: 0; background: #141518; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 32px;
  }
  #gate input {
    font-size: 28px; letter-spacing: 8px; text-align: center; width: 220px;
    padding: 10px; border-radius: 12px; border: 1px solid #2e3138;
    background: #1e2024; color: #fff;
  }
  #gate button {
    font-size: 16px; font-weight: 600; padding: 12px 28px; border-radius: 12px;
    border: none; background: #2563eb; color: #fff;
  }
  #gate .err { color: #f26d6d; min-height: 20px; font-size: 14px; }
  #gate .hint { color: #a3a7ae; font-size: 13px; text-align: center; }
  #modes { display: none; flex: none; margin: 0 12px 8px; gap: 8px; }
  #modes button {
    flex: 1; padding: 10px 0; font-size: 14px; font-weight: 600;
    border-radius: 12px; border: 1px solid #2e3138;
    background: #1e2024; color: #a3a7ae;
  }
  #modes button.on { background: #2563eb; color: #fff; border-color: #2563eb; }
  #kbd {
    display: none; flex: 1; flex-direction: column; gap: 8px;
    margin: 0 12px calc(12px + env(safe-area-inset-bottom));
    touch-action: auto; user-select: text; -webkit-user-select: text;
  }
  #kbd textarea {
    flex: none; width: 100%; height: 25vh; min-height: 96px;
    border: 1px solid #2e3138; border-radius: 16px; background: #1e2024;
    color: #eceef1; font: inherit; padding: 12px; resize: none;
  }
  .chips { display: flex; gap: 6px; }
  .chips button {
    flex: 1; padding: 10px 0; font-size: 13px; font-weight: 600;
    border-radius: 10px; border: 1px solid #2e3138;
    background: #1e2024; color: #a3a7ae;
  }
  .chips button.on { background: #2563eb; color: #fff; border-color: #2563eb; }
  .krow { display: flex; gap: 6px; }
  .krow button {
    flex: 1; padding: 12px 0; font-size: 14px; border-radius: 10px;
    border: 1px solid #2e3138; background: #1e2024; color: #eceef1;
  }
  #fkeys { display: flex; gap: 6px; overflow-x: auto; touch-action: pan-x; }
  #fkeys button {
    flex: none; padding: 10px 14px; font-size: 13px; border-radius: 10px;
    border: 1px solid #2e3138; background: #1e2024; color: #eceef1;
  }
</style>
</head>
<body>
<div id="bar">Phone Trackpad</div>
<div id="pad">Drag to move &middot; tap to click<br>Press, hold still, then drag = drag items<br>Two fingers: tap = right click, drag = scroll<br>Three-finger tap = middle click</div>
<div id="modes">
  <button id="mPad" class="on">Trackpad</button>
  <button id="mKbd">Keyboard</button>
</div>
<div id="kbd">
  <div class="chips" id="mods"></div>
  <textarea id="kbtext" placeholder="Type here &mdash; text lands on the computer" autocapitalize="sentences"></textarea>
  <div class="krow" id="row1"></div>
  <div class="krow" id="row2"></div>
  <div id="fkeys"></div>
</div>
<div id="gate">
  <div style="font-size:18px;font-weight:650">Pair this browser</div>
  <div class="hint">On the computer: Phone Trackpad &rarr; “Browser code”.<br>Type the 6-digit code here. Trusted Wi-Fi only.</div>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="––––––">
  <button id="go">Connect</button>
  <div class="err" id="err"></div>
</div>
<script>
'use strict';
// Thresholds mirror apps/mobile/lib/gesture.dart.
const TAP_MS = 200, TAP_PX = 12, HOLD_MS = 250, SLOP_PX = 10, DBL_MS = 350, DBL_PX = 24;
let token = null, seq = 0;
let threeTap = false, threeT0 = 0, threeTravel = 0;
const bar = document.getElementById('bar');
const pad = document.getElementById('pad');

async function post(path, obj) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(obj),
    keepalive: false,
  });
  return r.json();
}

document.getElementById('go').onclick = async () => {
  const pin = document.getElementById('pin').value.trim();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await post('/api/pair', { pin });
    if (!r.ok) { err.textContent = 'Code rejected. Check it and try again.'; return; }
    token = r.token; seq = 0;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('modes').style.display = 'flex';
    bar.textContent = 'Connected — touch to move';
    bar.classList.add('live');
  } catch (e) {
    err.textContent = 'Could not reach the computer.';
  }
};

// QR scans land here with the code in the fragment (never sent on the wire).
window.addEventListener('load', () => {
  const m = location.hash.match(/^#(\d{6})$/);
  if (m) {
    document.getElementById('pin').value = m[1];
    document.getElementById('go').click();
  }
});

function send(msgs) {
  if (!token || !msgs.length) return;
  post('/api/input', { token, seq: seq++, msgs }).catch(() => {});
}

let lastClickT = -1e9;
// Windows reads a second left press within ~500 ms at the same spot as
// a double click: on a title bar that maximizes the window instead of
// dragging it (text selection has no such side effect, which is why
// double-tap-drag "worked" there). When a drag engages soon after a
// click, nudge the cursor a few px first so the OS never sees the
// double click. Nudging down keeps a title-bar grab inside HTCAPTION.
function engageDrag() {
  maybeDrag = false; dragging = true;
  const msgs = now() - lastClickT <= 550 ? [{ t: 'move', dx: 0, dy: 6 }] : [];
  msgs.push({ t: 'down', b: 0 });
  send(msgs);
}

// ---- keyboard mode (ADR-0005) ----
// HID usages mirrored from apps/mobile/lib/hid.dart and trackpad-core.
const HID = {
  enter: 0x28, bksp: 0x2a, esc: 0x29, tab: 0x2b,
  left: 0x50, right: 0x4f, down: 0x51, up: 0x52,
  home: 0x4a, end: 0x4d, pgup: 0x4b, pgdn: 0x4e, del: 0x4c,
};
const MOD_DEFS = [ // [label, bit, HID usage (informational; the desktop
  // presses/releases the modifiers around each key from the bitmask)]
  ['Ctrl', 1, 0xe0], ['Alt', 2, 0xe2], ['Shift', 4, 0xe1], ['Meta', 8, 0xe3],
];
let mods = 0;
let kbLast = '';
const kbtext = document.getElementById('kbtext');

// Batches are capped at 64 msgs server-side; stay well under.
const BATCH = 60;

function keyTap(usage) {
  send([{ t: 'key', u: usage, m: mods, d: true }, { t: 'key', u: usage, m: mods, d: false }]);
}

function backspaces(n) {
  const msgs = [];
  for (let i = 0; i < n; i++) {
    msgs.push({ t: 'key', u: HID.bksp, m: 0, d: true });
    msgs.push({ t: 'key', u: HID.bksp, m: 0, d: false });
  }
  for (let i = 0; i < msgs.length; i += BATCH) send(msgs.slice(i, i + BATCH));
}

function typeChunk(s) {
  // Chunk by code points so a surrogate pair never splits across batches.
  const cps = [...s];
  for (let i = 0; i < cps.length; i += BATCH) send([{ t: 'text', s: cps.slice(i, i + BATCH).join('') }]);
}

kbtext.addEventListener('input', () => {
  const t = kbtext.value;
  if (t.length > kbLast.length && t.startsWith(kbLast)) {
    typeChunk(t.slice(kbLast.length));
  } else if (t.length < kbLast.length && kbLast.startsWith(t)) {
    backspaces(kbLast.length - t.length);
  } else {
    // Cursor moved or a selection was replaced: clear old, type new.
    backspaces(kbLast.length);
    typeChunk(t);
  }
  kbLast = t;
});

// Modifier chips: sticky bitmask carried on every KEY event.
const modsEl = document.getElementById('mods');
for (const [label, bit] of MOD_DEFS) {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = () => {
    mods ^= bit;
    b.classList.toggle('on', mods & bit);
  };
  modsEl.appendChild(b);
}

function keyRow(el, defs) {
  for (const [label, usage] of defs) {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => keyTap(usage);
    el.appendChild(b);
  }
}
keyRow(document.getElementById('row1'), [
  ['Esc', HID.esc], ['Tab', HID.tab],
  ['←', HID.left], ['↑', HID.up], ['↓', HID.down], ['→', HID.right],
  ['Enter', HID.enter],
]);
keyRow(document.getElementById('row2'), [
  ['Home', HID.home], ['End', HID.end], ['PgUp', HID.pgup],
  ['PgDn', HID.pgdn], ['Del', HID.del],
]);
const fkeys = document.getElementById('fkeys');
for (let n = 1; n <= 12; n++) {
  const b = document.createElement('button');
  b.textContent = 'F' + n;
  b.onclick = () => keyTap(0x39 + n);
  fkeys.appendChild(b);
}

// Mode switch: both modes ride the same browser session.
let mode = 'pad';
const barTexts = { pad: 'Connected — touch to move', kbd: 'Connected — type in the box' };
function setMode(m) {
  if (m === mode || !token) return;
  mode = m;
  document.getElementById('pad').style.display = m === 'pad' ? 'flex' : 'none';
  document.getElementById('kbd').style.display = m === 'kbd' ? 'flex' : 'none';
  document.getElementById('mPad').classList.toggle('on', m === 'pad');
  document.getElementById('mKbd').classList.toggle('on', m === 'kbd');
  bar.textContent = barTexts[m];
  if (m === 'kbd') kbtext.focus();
}
document.getElementById('mPad').onclick = () => setMode('pad');
document.getElementById('mKbd').onclick = () => setMode('kbd');

// ---- gesture engine (single + two finger) ----
const fingers = new Map(); // pointerId -> {x,y,t0,travel}
let lastTapT = -1e9, lastTapX = 0, lastTapY = 0;
let maybeDrag = false, dragging = false, scrolling = false;
let twoT0 = 0, twoTravel = 0, remX = 0, remY = 0, noTap = false;

function now() { return performance.now(); }

pad.addEventListener('pointerdown', (e) => {
  pad.setPointerCapture(e.pointerId);
  fingers.set(e.pointerId, { x: e.clientX, y: e.clientY, t0: now(), travel: 0 });
  if (fingers.size === 3) {
    // Three fingers: middle-click candidate. Cancel one/two-finger state;
    // all three lifts are consumed by the tap logic below.
    maybeDrag = false; scrolling = false; noTap = true;
    threeTap = true; threeT0 = now(); threeTravel = 0;
    if (dragging) { dragging = false; send([{ t: 'up', b: 0 }]); }
    return;
  }
  if (fingers.size > 2) { fingers.clear(); maybeDrag = false; scrolling = false; noTap = true; threeTap = false; return; }
  if (fingers.size === 2) {
    maybeDrag = false; scrolling = true; twoT0 = now(); twoTravel = 0; noTap = true;
    if (dragging) { dragging = false; send([{ t: 'up', b: 0 }]); }
    return;
  }
  const t = now();
  maybeDrag = (t - lastTapT) <= DBL_MS &&
    Math.abs(e.clientX - lastTapX) <= DBL_PX && Math.abs(e.clientY - lastTapY) <= DBL_PX;
  noTap = false; dragging = false; remX = 0; remY = 0;
  fingers.get(e.pointerId).anchor = { x: e.clientX, y: e.clientY, t };
  // Press and hold still = drag intent: the button goes down while the
  // finger sits still, moves then drag the item, lift releases it. The
  // travel check at fire time keeps a finger that is already moving on
  // normal cursor duty (no drag).
  const heldId = e.pointerId;
  setTimeout(() => {
    const f = fingers.get(heldId);
    if (f && fingers.size === 1 && !dragging && !scrolling && !threeTap) {
      // Stillness measured from the anchor, not accumulated travel: a
      // resting finger jitters a few px and must still count as held.
      const dx = f.x - f.anchor.x, dy = f.y - f.anchor.y;
      if (Math.hypot(dx, dy) <= SLOP_PX) {
        engageDrag();
      }
    }
  }, HOLD_MS);
});

pad.addEventListener('pointermove', (e) => {
  const f = fingers.get(e.pointerId);
  if (!f) return;
  const dx = e.clientX - f.x, dy = e.clientY - f.y;
  f.x = e.clientX; f.y = e.clientY; f.travel += Math.abs(dx) + Math.abs(dy);
  if (threeTap) { threeTravel += Math.abs(dx) + Math.abs(dy); return; }
  if (scrolling) {
    twoTravel += Math.abs(dx) + Math.abs(dy);
    const ix = Math.trunc(dx / 2), iy = Math.trunc(dy / 2);
    if (ix || iy) send([{ t: 'scroll', dx: ix, dy: iy }]);
    return;
  }
  if (fingers.size !== 1) return;
  if (maybeDrag && !dragging) {
    if (f.travel > SLOP_PX) { engageDrag(); }
    else return;
  }
  const x = dx + remX, y = dy + remY;
  const ix = Math.trunc(x), iy = Math.trunc(y);
  remX = x - ix; remY = y - iy;
  if (ix || iy) send([{ t: 'move', dx: ix, dy: iy }]);
});

function up(e) {
  const f = fingers.get(e.pointerId);
  fingers.delete(e.pointerId);
  if (!f) return;
  const t = now();
  if (threeTap) {
    // Decide on the last of the three lifts.
    if (fingers.size !== 0) return;
    threeTap = false;
    if ((t - threeT0) <= TAP_MS && threeTravel <= TAP_PX * 2) {
      lastClickT = t;
      send([{ t: 'click', b: 2 }]);
    }
    return;
  }
  if (scrolling && fingers.size < 2) {
    scrolling = false;
    const quick = (t - twoT0) <= TAP_MS && twoTravel <= TAP_PX * 2;
    if (quick) { lastClickT = t; send([{ t: 'click', b: 1 }]); }
    return;
  }
  if (fingers.size !== 0 || scrolling) return;
  if (dragging) { dragging = false; maybeDrag = false; send([{ t: 'up', b: 0 }]); return; }
  if (noTap) { noTap = false; maybeDrag = false; return; }
  if (maybeDrag) {
    maybeDrag = false;
    if (t - f.anchor.t <= TAP_MS && f.travel <= TAP_PX) {
      lastTapT = t; lastTapX = e.clientX; lastTapY = e.clientY;
      lastClickT = t;
      send([{ t: 'click', b: 0 }]);
    }
    return;
  }
  const dt = t - f.anchor.t;
  if (dt <= TAP_MS && Math.abs(e.clientX - f.anchor.x) <= TAP_PX && Math.abs(e.clientY - f.anchor.y) <= TAP_PX) {
    lastTapT = t; lastTapX = e.clientX; lastTapY = e.clientY;
    lastClickT = t;
    send([{ t: 'click', b: 0 }]);
  }
}
pad.addEventListener('pointerup', up);
pad.addEventListener('pointercancel', up);
// Phone browsers cancel pointer events when a long press triggers a
// native behavior (iOS callout/loupe, Android context menu). Suppress
// those defaults on the pad only — keyboard mode needs native input.
pad.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
</script>
</body>
</html>
